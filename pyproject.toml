[build-system]
requires = ["setuptools>=75", "wheel", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "eth-tester"
dynamic = ["version"]
description = "eth-tester: Tools for testing Ethereum applications."
readme = "README.md"
requires-python = ">=3.10,<4"
license = "MIT"
authors = [
    {name = "The Ethereum Foundation", email = "snakecharmers@ethereum.org"},
    {name = "ApeWorX Collective", email = "admin@apeworx.io"},
]
maintainers = [
    {name = "ApeWorX Collective", email = "admin@apeworx.io"},
]
keywords = ["ethereum"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "eth-abi>=6",
    "eth-account>=0.14",
    "eth-keys>=0.5",
    "eth-utils>=6",
    "rlp>=5",
    "semantic_version>=2.6.0",
]

[project.urls]
Homepage = "https://github.com/ApeWorX/eth-tester"
Repository = "https://github.com/ApeWorX/eth-tester.git"
Issues = "https://github.com/ApeWorX/eth-tester/issues"

[project.optional-dependencies]
py-evm = [
    "py-evm>=0.12.0b2,<0.13.0b1",
    "eth-hash[pysha3]>=0.1.4,<1.0.0; implementation_name == 'cpython'",
    "eth-hash[pycryptodome]>=0.1.4,<1.0.0; implementation_name == 'pypy'",
]
pyevm = [
    "py-evm>=0.12.0b2,<0.13.0b1",
    "eth-hash[pysha3]>=0.1.4,<1.0.0; implementation_name == 'cpython'",
    "eth-hash[pycryptodome]>=0.1.4,<1.0.0; implementation_name == 'pypy'",
]

[dependency-groups]
test = [
    "pytest>=7.0.0",
    "pytest-xdist>=2.0.0,<3",
    "eth-hash[pycryptodome]>=0.1.4,<1.0.0",
]
lint = [
    "ruff>=0.12.0",
    "mypy>=1.18.2",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.3.5",
    "mdformat-frontmatter>=0.4.1",
    "mdformat-pyproject>=0.0.2",
]
docs = []
dev = [
    {include-group = "test"},
    {include-group = "lint"},
    {include-group = "docs"},
    "ipython",
    "prek",
]

[tool.setuptools.packages.find]
exclude = ["scripts", "scripts.*", "tests", "tests.*"]
namespaces = false

[tool.setuptools_scm]

[tool.pytest.ini_options]
addopts = "-v --showlocals --durations 10"
log_date_format = "%m-%d %H:%M:%S"
log_format = "%(levelname)8s  %(asctime)s  %(filename)20s  %(message)s"
xfail_strict = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".project-template"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "B",
    "I",
    "UP",
]
ignore = [
    "B006",
    "B007",
    "B009",
    "B010",
    "B011",
    "B012",
    "B018",
    "B023",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"eth_tester/validation/inbound.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["eth_tester"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"
indent-style = "space"
docstring-code-format = true

[tool.mdformat]
number = true

[tool.mypy]
check_untyped_defs = true
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "index",
    "no-redef",
    "operator",
    "str-bytes-safe",
    "type-var",
    "union-attr",
    "var-annotated",
]
disallow_any_generics = false
disallow_incomplete_defs = false
disallow_subclassing_any = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_untyped_defs = false
ignore_missing_imports = true
strict_equality = true
strict_optional = true
warn_redundant_casts = false
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
